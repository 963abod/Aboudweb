<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABOUD Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px;
    }

    .box {
      max-width: 450px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #dashboard {
      display: none;
    }
  </style>
</head>

<body>

<div class="box" id="login">
  <h1>ABOUD Admin</h1>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="message"></p>
</div>

<div class="box" id="dashboard">
  <h1>Dashboard</h1>

  <p>تم تسجيل الدخول بنجاح ✅</p>

  <button onclick="logout()">Logout</button>
</div>

<script>
const SUPABASE_URL = "https://ywjwfbvkyrisrxbiqffa.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "sb_publishable_e__qknAiR8Rqtx4dMS-2Yg_S9FjfjxR";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function login() {
  console.log("LOGIN BUTTON WORKING");
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    document.getElementById("message").textContent = error.message;
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
}

async function logout() {
  await supabaseClient.auth.signOut();

  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login").style.display = "block";
}
</script>

</body>
</html>
